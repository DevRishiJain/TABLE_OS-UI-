<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222B"/>
      <stop offset="100%" stop-color="#0F1115"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Chef Hat (Cooking Toque) -->
  <path d="M22 27C18.5 27 16 24 16 20.5C16 16.5 19.5 13.5 23.5 13.5C24.5 10 28 7.5 32 7.5C36 7.5 39.5 10 40.5 13.5C44.5 13.5 48 16.5 48 20.5C48 24 45.5 27 42 27Z" fill="#F8FAFC"/>
  <!-- Chef Hat Base Band -->
  <rect x="20" y="26" width="24" height="6" rx="2" fill="url(#goldGrad)"/>

  <!-- Sizzling Cooking Pan / Wok Body -->
  <path d="M15 38C15 38 17.5 48 32 48C46.5 48 49 38 49 38H15Z" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Pan Rim -->
  <ellipse cx="32" cy="38" rx="17" ry="2.5" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <!-- Pan Handles -->
  <path d="M15 38L9 35" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M49 38L55 35" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cooking Sizzle Flame Below Pan -->
  <path d="M32 50C29 50 27 52.5 27 55C27 57.5 29.5 59.5 32 59.5C34.5 59.5 37 57.5 37 55C37 52.5 35 50 32 50Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <path d="M32 53C30.5 53 29.5 54.5 29.5 56C29.5 57 30.5 58 32 58C33.5 58 34.5 57 34.5 56C34.5 54.5 33.5 53 32 53Z" fill="#FEF08A"/>

  <!-- Steam Whisps -->
  <path d="M25 35C24.5 32.5 26 31 27 29.5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 35C31.5 32 33 30.5 33.5 29" stroke="#F97316" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M39 35C38.5 32.5 40 31 40.5 29.5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
</svg>
